plugins { id 'com.android.application' }

android {
    namespace 'com.parevetimer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.parevetimer.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
